name: Publish Privacy Policy

on:
  push:
    branches: [main]
    paths:
      - "public/legal/**"
      - ".github/workflows/privacy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Prepare website
        run: |
          mkdir -p _site/legal
          cp -R public/legal/. _site/legal/
          echo '<meta http-equiv="refresh" content="0;url=legal/en/privacy-policy.html">' > _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
